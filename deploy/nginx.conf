server {
    listen 80;
    listen [::]:80;
    server_name distribuidora-dpq.buckapi.lat;

    root /var/www/distribuidora-dpq/current;
    index index.html;

    access_log /var/log/nginx/distribuidora-dpq.buckapi.lat.access.log;
    error_log /var/log/nginx/distribuidora-dpq.buckapi.lat.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* "\\.[a-f0-9]{8,}\\.(?:js|css|woff2?|ttf|otf|png|jpe?g|webp|avif|svg|ico)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name distribuidora-dpq.buckapi.lat;

    root /var/www/distribuidora-dpq/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/distribuidora-dpq.buckapi.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/distribuidora-dpq.buckapi.lat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
