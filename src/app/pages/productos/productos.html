<main class="main"><div class="site-breadcrumb"><div class="site-breadcrumb-bg" style="background:url(assets/img/breadcrumb/01.jpg)"></div><div class="container"><div class="site-breadcrumb-wrap"><h4 class="breadcrumb-title">Categorías</h4><ul class="breadcrumb-menu"><li><a routerLink="/"><i class="far fa-home"></i> Inicio</a></li><li class="active">Categorías</li></ul></div></div></div>
<div class="category-area py-120"><div class="container"><div class="row"><div class="col-lg-6 mx-auto"><div class="site-heading text-center"><span class="site-title-tagline">Nuestros productos</span><h2 class="site-title">Explora nuestras categorías</h2></div></div></div>
<div class="row g-3 justify-content-center dpq-category-grid">@for (category of categories(); track category.slug) {<div class="col-6 col-md-4 col-lg-2"><div class="category-item"><a routerLink="/shop-grid" [queryParams]="{categoria:category.slug}"><div class="category-info"><div class="icon">@if (category.image) {<img [src]="category.image" [alt]="category.name" loading="lazy">} @else {<i class="fi fi-rr-apps" aria-hidden="true"></i>}</div><div class="content"><h4>{{ category.name }}</h4></div></div></a></div></div>}</div></div></div></main>
